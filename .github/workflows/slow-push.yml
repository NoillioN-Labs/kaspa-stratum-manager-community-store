name: Slow Push - Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.3.0
        required: true
        type: string
      confirmation:
        description: Type SLOW PUSH to run the full release workflow
        required: true
        type: string

concurrency:
  group: slow-push
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/noillion-labs/kaspa-stratum-manager

jobs:
  validate:
    name: Validate sanitized release source
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation
        if: inputs.confirmation != 'SLOW PUSH'
        run: exit 1

      - name: Validate semantic version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must use semantic version format, for example 1.3.0"
            exit 1
          fi

      - name: Check out sanitized public source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kaspa-stratum-manager/package-lock.json

      - name: Install dependencies
        working-directory: kaspa-stratum-manager
        run: npm ci --no-audit --no-fund

      - name: Detect the current package channel
        working-directory: kaspa-stratum-manager
        run: |
          if grep -q 'kaspa-stratum-manager:fast@sha256:' docker-compose.yml; then
            echo "KSM_PACKAGE_CHANNEL=fast" >> "$GITHUB_ENV"
          else
            echo "KSM_PACKAGE_CHANNEL=slow" >> "$GITHUB_ENV"
          fi

      - name: Run full validation
        working-directory: kaspa-stratum-manager
        run: |
          npm test
          npm run lint
          node scripts/check-public-safety.mjs

  build-amd64:
    name: Build complete image on native AMD64
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out sanitized public source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 image by digest
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./kaspa-stratum-manager
          file: ./kaspa-stratum-manager/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ inputs.version }}
            KSM_DONATION_KASPA_ADDRESS=${{ secrets.KSM_DONATION_KASPA_ADDRESS }}
            KSM_DONATION_BITCOIN_ADDRESS=${{ secrets.KSM_DONATION_BITCOIN_ADDRESS }}
          cache-from: type=gha,scope=slow-release-amd64
          cache-to: type=gha,mode=max,scope=slow-release-amd64
          provenance: mode=max
          sbom: true

  build-arm64:
    name: Build complete image on native ARM64
    needs: validate
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out sanitized public source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image by digest
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./kaspa-stratum-manager
          file: ./kaspa-stratum-manager/Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ inputs.version }}
            KSM_DONATION_KASPA_ADDRESS=${{ secrets.KSM_DONATION_KASPA_ADDRESS }}
            KSM_DONATION_BITCOIN_ADDRESS=${{ secrets.KSM_DONATION_BITCOIN_ADDRESS }}
          cache-from: type=gha,scope=slow-release-arm64
          cache-to: type=gha,mode=max,scope=slow-release-arm64
          provenance: mode=max
          sbom: true

  publish:
    name: Publish immutable multi-architecture release
    needs: [validate, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the validated release source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kaspa-stratum-manager/package-lock.json

      - name: Install dependencies
        working-directory: kaspa-stratum-manager
        run: npm ci --no-audit --no-fund

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the versioned multi-architecture manifest
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test -n "$AMD64_DIGEST"
          test -n "$ARM64_DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_VERSION" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"

      - name: Verify the published manifest and capture its digest
        id: manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$RELEASE_VERSION" > manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' manifest.json
          RELEASE_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" | awk '/^Digest:/ {print $2; exit}')
          if ! printf '%s' "$RELEASE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Unable to capture the immutable manifest digest"
            exit 1
          fi
          echo "digest=$RELEASE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Pin the immutable release package
        working-directory: kaspa-stratum-manager
        env:
          RELEASE_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          KSM_PACKAGE_CHANNEL: slow
        run: |
          node scripts/pin-package.mjs slow "$RELEASE_DIGEST" "$RELEASE_VERSION" "$SOURCE_SHA"
          npm run test:packaging
          node scripts/check-public-safety.mjs

      - name: Publish the package pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaspa-stratum-manager/docker-compose.yml kaspa-stratum-manager/umbrel-app.yml kaspa-stratum-manager/Dockerfile.fast
          if git diff --cached --quiet; then
            echo "Package already pinned"
          else
            git commit -m "Pin immutable release ${{ inputs.version }}"
            git push
          fi

      - name: Record immutable digest
        env:
          RELEASE_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "Published multi-architecture image:" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$RELEASE_VERSION@$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64 (native builds)" >> "$GITHUB_STEP_SUMMARY"
