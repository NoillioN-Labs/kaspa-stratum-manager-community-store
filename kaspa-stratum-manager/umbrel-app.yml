manifestVersion: 1.1
id: kaspa-stratum-manager
category: kaspa
name: Kaspa Solo Mining Console
version: "1.2.4"
tagline: Manage, monitor and understand Kaspa solo mining
icon: https://raw.githubusercontent.com/NoillioN-Labs/kaspa-stratum-manager-community-store/main/kaspa-stratum-manager/icon.svg
description: >-
  A local-first Umbrel interface for the official Rusty Kaspa Stratum Bridge.
  Monitor miners, hashrate, shares and confirmed blocks; follow locally found
  blocks through DAG resolution to realised rewards; review historical mining
  performance; run diagnostics; and apply safe bridge settings with automatic
  rollback. Requires the Rusty Kaspad Umbrel app.
developer: NoillioN Labs
dependencies: [rusty-kaspad]
