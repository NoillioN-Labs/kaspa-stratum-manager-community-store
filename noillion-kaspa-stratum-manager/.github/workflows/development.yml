name: Development validation
on:
  push:
    branches: ['development/**']
  pull_request:
    branches: [session-2-management-api]
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm test
      - name: Browser checks with isolated simulated data
        run: |
          npx playwright install --with-deps chromium
          node tests/preview-fixture.mjs > /tmp/ksm-fixture.log 2>&1 &
          fixture_pid=$!
          npx vinext dev --port 3100 --host 127.0.0.1 > /tmp/ksm-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$fixture_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3100/ > /dev/null && curl -fsS http://127.0.0.1:8081/api/manager/stats > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser.mjs
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build application against the immutable 1.3.0 bridge
        run: docker build -f Dockerfile.fast -t ksm-development .
      - name: Check image modules without hardware
        run: |
          docker run --rm --entrypoint /bin/sh ksm-development -c 'test -x /usr/local/bin/stratum-bridge && test -f /opt/kaspa-stratum-manager/package.json'
          docker run --rm --entrypoint node ksm-development --check /opt/kaspa-stratum-manager/server/manager.mjs

