// Minimal read-only subset of Rusty Kaspa v2.0.1's gRPC protocol.
// Field numbers and service shape are pinned to:
// https://github.com/kaspanet/rusty-kaspa/tree/v2.0.1/rpc/grpc/core/proto
syntax = "proto3";
package protowire;

message RPCError { string message = 1; }

message RpcBlockLevelParents { repeated string parentHashes = 1; }
message RpcBlockHeader {
  uint32 version = 1;
  repeated RpcBlockLevelParents parents = 12;
  string hashMerkleRoot = 3;
  string acceptedIdMerkleRoot = 4;
  string utxoCommitment = 5;
  int64 timestamp = 6;
  uint32 bits = 7;
  uint64 nonce = 8;
  uint64 daaScore = 9;
  string blueWork = 10;
  uint64 blueScore = 13;
  string pruningPoint = 14;
  string hash = 15;
}

message RpcBlockVerboseData {
  string hash = 1;
  double difficulty = 11;
  string selectedParentHash = 13;
  repeated string transactionIds = 14;
  bool isHeaderOnly = 15;
  uint64 blueScore = 16;
  repeated string childrenHashes = 17;
  repeated string mergeSetBluesHashes = 18;
  repeated string mergeSetRedsHashes = 19;
  bool isChainBlock = 20;
}

message RpcScriptPublicKey { uint32 version = 1; string scriptPublicKey = 2; }
message RpcTransactionOutput {
  uint64 amount = 1;
  RpcScriptPublicKey scriptPublicKey = 2;
}
message RpcTransaction {
  uint32 version = 1;
  repeated RpcTransactionOutput outputs = 3;
  uint64 lockTime = 4;
  string subnetworkId = 5;
  uint64 gas = 6;
  string payload = 8;
  uint64 storage_mass = 10;
}
message RpcBlock {
  RpcBlockHeader header = 1;
  repeated RpcTransaction transactions = 2;
  RpcBlockVerboseData verboseData = 3;
}

message GetServerInfoRequestMessage {}
message GetServerInfoResponseMessage {
  uint32 rpcApiVersion = 1;
  uint32 rpcApiRevision = 2;
  string serverVersion = 3;
  string networkId = 4;
  bool hasUtxoIndex = 5;
  bool isSynced = 6;
  uint64 virtualDaaScore = 7;
  RPCError error = 1000;
}

message GetBlockRequestMessage { string hash = 1; bool includeTransactions = 3; }
message GetBlockResponseMessage { RpcBlock block = 3; RPCError error = 1000; }

enum BlockColor { UNKNOWN = 0; BLUE = 1; RED = 2; }
message GetBlockRewardInfoRequestMessage { string hash = 1; }
message GetBlockRewardInfoResponseMessage {
  RpcBlockHeader header = 1;
  BlockColor blockColor = 2;
  optional uint64 confirmationCount = 3;
  optional string mergingChainBlockHash = 4;
  optional uint64 rewardAmount = 5;
  RPCError error = 1000;
}

enum RpcNotifyCommand { NOTIFY_START = 0; NOTIFY_STOP = 1; }
message NotifyBlockAddedRequestMessage { RpcNotifyCommand command = 101; }
message NotifyBlockAddedResponseMessage { RPCError error = 1000; }
message BlockAddedNotificationMessage { RpcBlock block = 3; }
message NotifyVirtualChainChangedRequestMessage { bool includeAcceptedTransactionIds = 1; RpcNotifyCommand command = 101; }
message NotifyVirtualChainChangedResponseMessage { RPCError error = 1000; }
message VirtualChainChangedNotificationMessage { repeated string removedChainBlockHashes = 1; repeated string addedChainBlockHashes = 3; }
message GetBlockDagInfoRequestMessage {}
message GetBlockDagInfoResponseMessage { string networkName = 1; uint64 blockCount = 2; uint64 headerCount = 3; repeated string tipHashes = 4; double difficulty = 5; int64 pastMedianTime = 6; repeated string virtualParentHashes = 7; string pruningPointHash = 8; uint64 virtualDaaScore = 9; string sink = 10; RPCError error = 1000; }
message GetConnectedPeerInfoRequestMessage {}
message GetConnectedPeerInfoMessage { string id = 1; }
message GetConnectedPeerInfoResponseMessage { repeated GetConnectedPeerInfoMessage infos = 1; RPCError error = 1000; }
message KaspadRequest {
  uint64 id = 101;
  oneof payload {
    GetBlockRequestMessage getBlockRequest = 1025;
    NotifyBlockAddedRequestMessage notifyBlockAddedRequest = 1007;
    NotifyVirtualChainChangedRequestMessage notifyVirtualChainChangedRequest = 1022;
    GetBlockDagInfoRequestMessage getBlockDagInfoRequest = 1035;
    GetConnectedPeerInfoRequestMessage getConnectedPeerInfoRequest = 1016;
    GetServerInfoRequestMessage getServerInfoRequest = 1092;
    GetBlockRewardInfoRequestMessage getBlockRewardInfoRequest = 1116;
  }
}

message KaspadResponse {
  uint64 id = 101;
  oneof payload {
    GetBlockResponseMessage getBlockResponse = 1026;
    NotifyBlockAddedResponseMessage notifyBlockAddedResponse = 1008;
    BlockAddedNotificationMessage blockAddedNotification = 1009;
    NotifyVirtualChainChangedResponseMessage notifyVirtualChainChangedResponse = 1023;
    VirtualChainChangedNotificationMessage virtualChainChangedNotification = 1024;
    GetBlockDagInfoResponseMessage getBlockDagInfoResponse = 1036;
    GetConnectedPeerInfoResponseMessage getConnectedPeerInfoResponse = 1017;
    GetServerInfoResponseMessage getServerInfoResponse = 1093;
    GetBlockRewardInfoResponseMessage getBlockRewardInfoResponse = 1117;
  }
}

service RPC {
  rpc MessageStream (stream KaspadRequest) returns (stream KaspadResponse) {}
}
